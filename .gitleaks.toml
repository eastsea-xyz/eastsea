# Secret scan (gitleaks) before publishing: default rules plus ours.
[extend]
useDefault = true

[[rules]]
id = "real-public-ip-of-our-hosts"
description = "Public IPs of our own machines (use documentation IPs: 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24)"
regex = '''\b(14\.32\.162\.195|124\.50\.132\.71|220\.85\.111\.89)\b'''

[[rules]]
id = "apple-api-key-id"
description = "Apple API key file names or ids"
regex = '''AuthKey_[A-Z0-9]{10}\.p8'''

[allowlist]
description = "Validator public keys in network files are public by design"
paths = ['''apps/wallet/Resources/network\.json''']
