[workspace]
resolver = "2"
members = ["legacy", "crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.2.0"

# Versions pinned per docs/design/01-workspace.md
[workspace.dependencies]
aether-types = { path = "crates/types" }
aether-hash = { path = "crates/hash" }
aether-crypto = { path = "crates/crypto" }
aether-state = { path = "crates/state" }
aether-execution = { path = "crates/execution" }
aether-consensus = { path = "crates/consensus" }
aether-da = { path = "crates/da" }
aether-proving = { path = "crates/proving" }
aether-light = { path = "crates/light" }
aether-net = { path = "crates/net" }
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
thiserror = "2"
blake3 = "=1.8.7"
p3-poseidon2 = "=0.8.0"
p3-koala-bear = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-field = "=0.8.0"
rand = "0.9"
rand_chacha = "0.9"
p256 = { version = "=0.14.0", features = ["ecdsa"] }
k256 = { version = "=0.14.0", features = ["ecdsa"] }
ed25519-dalek = { version = "=3.0.0" }
proptest = "1.11"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

# n0-mainline 0.6.0: get_mutable_most_recent kept the first record instead of the
# highest seq, so stale DHT records could shadow a moved node. Patched copy.
[patch.crates-io]
n0-mainline = { path = "vendor/n0-mainline" }
