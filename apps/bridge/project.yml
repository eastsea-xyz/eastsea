# Aether 0.6.7, the bridge to EastSea (Sources/BridgePlan.swift explains why).
# Same bundle id, name and team as the Aether 0.6.6 it updates — Sparkle in
# 0.6.6 installs nothing else — and a build number above 0.6.6's 11.
#   scripts/build-bridge.sh        Release build into apps/bridge/build (clean)
#   scripts/release-bridge.sh      sign, notarize, DMG + legacy appcast
name: AetherBridge
options:
  bundleIdPrefix: com.pipln.aether
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  AetherBridge:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
      - path: ../wallet/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pipln.aether
        PRODUCT_NAME: Aether
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 45WU468FZE
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Pipln (45WU468FZE)"
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Aether
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSHumanReadableCopyright: Aether is now EastSea. EastSea testnet by Pipln.
        MARKETING_VERSION: 0.6.7
        CURRENT_PROJECT_VERSION: 12
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_SWIFT_FLAGS: -file-prefix-map $(SRCROOT)=/aether-node -debug-prefix-map $(SRCROOT)=/aether-node
        OTHER_LDFLAGS: -Wl,-reproducible
        ARCHS: arm64
