<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EastSea Explorer</title>
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A read-only block explorer for any EastSea node. Static files, no analytics, no external calls.">
  <link rel="icon" href="assets/dawn.svg" type="image/svg+xml">
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="design-components.css">
  <link rel="stylesheet" href="explorer.css">
</head>
<body>
  <a class="skip" href="#view">Skip to explorer</a>
  <header id="top"></header>
  <div id="notice" class="container" hidden></div>
  <main id="view" class="container" tabindex="-1"></main>
  <footer id="foot" class="container"></footer>
  <noscript><p class="container">The explorer is a static page that needs JavaScript to read the node's JSON-RPC.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
