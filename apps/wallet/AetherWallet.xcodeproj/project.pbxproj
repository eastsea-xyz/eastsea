			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The app carries its node (`aether follow`) and the agent CLI in Contents/Helpers,\n# signed like the app so the bundle verifies and notarizes as one.\nset -euo pipefail\nH=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers\"\nmkdir -p \"$H\"\nfor t in \"$SRCROOT/../../target/release/aether\" \"$SRCROOT/../../target/agent/aether-agent\" \"$SRCROOT/../../apps/prover/target/release/aether-prover\"; do\n  [ -x \"$t\" ] || continue\n  name=\"$(basename \"$t\")\"\n  # Keep the node's previous binary one update back (as aether.prev):\n  # if the new one cannot start, the app runs it instead\n  # (docs/design/24-self-healing.md layer 2, upgrade rollback).\n  if [ \"$name\" = \"aether\" ] && [ -x \"$H/aether\" ] && ! cmp -s \"$H/aether\" \"$t\"; then\n    cp -f \"$H/aether\" \"$H/aether.prev\"\n    codesign --force --options runtime --timestamp=none --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$H/aether.prev\"\n  fi\n  cp -f \"$t\" \"$H/\"\n  codesign --force --options runtime --timestamp=none --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$H/$name\"\ndone\n# The unattended-restart daemon (docs/design/29-unattended-restart.md):\n# SMAppService.daemon registers the plist from Contents/Library/LaunchDaemons,\n# whose BundleProgram (relative to the bundle root) is the root stub. The stub\n# and the user wrapper it drops to are shell scripts, so they live in\n# Contents/Resources, sealed by the app's own signature: Contents/Helpers is a\n# code location, where every file must carry its own signature\n# (codesign --verify --deep --strict, notarization).\nD=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons\"\nR=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources\"\nmkdir -p \"$D\" \"$R\"\ncp -f \"$SRCROOT/Daemons/com.pipln.eastsea.node.plist\" \"$D/\"\nchmod 644 \"$D/com.pipln.eastsea.node.plist\"\nfor s in eastsea-node-daemon.sh eastsea-node-wrapper.sh; do\n  rm -f \"$H/$s\"   # an older build placed them in Helpers\n  cp -f \"$SRCROOT/Helpers/$s\" \"$R/\"\n  chmod 755 \"$R/$s\"\ndone\nprog=$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' \"$D/com.pipln.eastsea.node.plist\")\n[ -x \"$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/$prog\" ] || { echo \"error: daemon BundleProgram $prog is not in the bundle\"; exit 1; }\n";
