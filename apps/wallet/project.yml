name: AetherWallet
options:
  bundleIdPrefix: com.pipln.eastsea
  # English is the source language. The catalog covers Korean, Japanese and
  # both Chinese scripts. macOS chooses the bundle localization, including
  # its per-application Language & Region setting.
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  AetherWallet:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
        excludes: ["**/.omc/**", ".omc/**"]
      - path: Resources
        buildPhase: resources
      - Assets.xcassets
      - path: Generated/aether_ffi.swift
    settings:
      base:
        # Distributed outside the App Store by Pipln: Developer ID signing, notarized.
        PRODUCT_BUNDLE_IDENTIFIER: com.pipln.eastsea
        PRODUCT_NAME: EastSea
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 45WU468FZE
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Pipln (45WU468FZE)"
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EastSea
        # Localization: every SwiftUI literal and String(localized:) goes to
        # Resources/Localizable.xcstrings (all five languages); the localization
        # gate rejects missing translations and keys.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        MARKETING_VERSION: 0.7.3
        # Build numbers never repeat across the product line: Aether 0.6.6 shipped
        # build 11 and the Aether 0.6.7 bridge (apps/bridge) ships build 12.
        CURRENT_PROJECT_VERSION: 16
        # Sparkle keys (feed URL, EdDSA public key) merged into the generated Info.plist.
        INFOPLIST_FILE: Info-mac.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSHumanReadableCopyright: EastSea testnet by Pipln. Test tokens have no value.
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated
        # -reproducible: the linker otherwise orders sections the way it happened
        # to walk them, so two builds of the same source differ (repro-env.sh gives
        # the Rust side the same flag; the UUID is this binary's own and is not
        # compared — repro-app-check.sh zeroes it).
        OTHER_LDFLAGS: -Wl,-reproducible $(SRCROOT)/../../target/release/libaether_ffi.a -framework SystemConfiguration -framework Security -framework CoreFoundation -framework OpenDirectory -framework IOKit
        # The checkout path must not reach the binary (scripts/repro-app-check.sh):
        # Swift records the source and object paths it was given.
        OTHER_SWIFT_FLAGS: -file-prefix-map $(SRCROOT)=/aether-node -debug-prefix-map $(SRCROOT)=/aether-node
        ARCHS: arm64
    postCompileScripts:
      - name: Check wallet translations
        basedOnDependencyAnalysis: false
        script: |
          # Every string the compiler extracted from this target's sources must
          # be in Resources/Localizable.xcstrings with all five languages.
          "$SRCROOT/../../scripts/check-wallet-l10n.sh" --stringsdata "$OBJECT_FILE_DIR_normal/$NATIVE_ARCH_ACTUAL"
    postBuildScripts:
      - name: Embed node and agent
        basedOnDependencyAnalysis: false
        script: |
          # The app carries its node (`aether follow`) and the agent CLI in Contents/Helpers,
          # signed like the app so the bundle verifies and notarizes as one.
          set -euo pipefail
          H="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$H"
          for t in "$SRCROOT/../../target/release/aether" "$SRCROOT/../../target/agent/aether-agent" "$SRCROOT/../../apps/prover/target/release/aether-prover"; do
            [ -x "$t" ] || continue
            name="$(basename "$t")"
            # Keep the node's previous binary one update back (as aether.prev):
            # if the new one cannot start, the app runs it instead
            # (docs/design/24-self-healing.md layer 2, upgrade rollback).
            if [ "$name" = "aether" ] && [ -x "$H/aether" ] && ! cmp -s "$H/aether" "$t"; then
              cp -f "$H/aether" "$H/aether.prev"
              codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$H/aether.prev"
            fi
            cp -f "$t" "$H/"
            codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$H/$name"
          done
          # The unattended-restart daemon (docs/design/29-unattended-restart.md):
          # SMAppService.daemon registers the plist from Contents/Library/LaunchDaemons,
          # whose BundleProgram (relative to the bundle root) is the root stub. The stub
          # and the user wrapper it drops to are shell scripts, so they live in
          # Contents/Resources, sealed by the app's own signature: Contents/Helpers is a
          # code location, where every file must carry its own signature
          # (codesign --verify --deep --strict, notarization).
          D="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          R="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources"
          mkdir -p "$D" "$R"
          cp -f "$SRCROOT/Daemons/com.pipln.eastsea.node.plist" "$D/"
          chmod 644 "$D/com.pipln.eastsea.node.plist"
          for s in eastsea-node-daemon.sh eastsea-node-wrapper.sh; do
            rm -f "$H/$s"   # an older build placed them in Helpers
            cp -f "$SRCROOT/Helpers/$s" "$R/"
            chmod 755 "$R/$s"
          done
          prog=$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$D/com.pipln.eastsea.node.plist")
          [ -x "$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/$prog" ] || { echo "error: daemon BundleProgram $prog is not in the bundle"; exit 1; }
      - name: Bundle explorer
        basedOnDependencyAnalysis: false
        script: |
          # The Explore tab serves apps/explorer from inside the app bundle
          # under a private scheme (BundledPageScheme): copy the pages, leave
          # the toolchain behind.
          set -euo pipefail
          DEST="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/Explorer"
          mkdir -p "$DEST"
          /usr/bin/rsync -a --delete --exclude test/ --exclude package.json --exclude README.md \
            "$SRCROOT/../../apps/explorer/" "$DEST/"
  AetherWalletIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["**/.omc/**", ".omc/**"]
      - path: Resources
        buildPhase: resources
      - Assets.xcassets
      - path: Generated/aether_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pipln.eastsea.ios
        PRODUCT_NAME: EastSea
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 45WU468FZE
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EastSea
        # Localization: every SwiftUI literal and String(localized:) goes to
        # Resources/Localizable.xcstrings (all five languages); the localization
        # gate rejects missing translations and keys.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The eastsea:// (and legacy aether://) URL scheme, merged into the generated Info.plist.
        INFOPLIST_FILE: Info-ios.plist
        INFOPLIST_KEY_NSFaceIDUsageDescription: Sign transactions with your device's Secure Enclave key.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated
        # Same as the macOS target: no checkout paths in the shipped binary, and a
        # link that does not depend on the order the linker walked the sections.
        OTHER_SWIFT_FLAGS: -file-prefix-map $(SRCROOT)=/aether-node -debug-prefix-map $(SRCROOT)=/aether-node
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": -Wl,-reproducible $(SRCROOT)/../../target/aarch64-apple-ios-sim/release/libaether_ffi.a -framework SystemConfiguration -framework Security -framework CoreFoundation -framework Network
        "OTHER_LDFLAGS[sdk=iphoneos*]": -Wl,-reproducible $(SRCROOT)/../../target/aarch64-apple-ios/release/libaether_ffi.a -framework SystemConfiguration -framework Security -framework CoreFoundation -framework Network
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    postBuildScripts:
      - name: Bundle explorer
        basedOnDependencyAnalysis: false
        script: |
          # Same as the Mac target: the Explore tab serves apps/explorer from
          # inside the app bundle under a private scheme (BundledPageScheme).
          set -euo pipefail
          DEST="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/Explorer"
          mkdir -p "$DEST"
          /usr/bin/rsync -a --delete --exclude test/ --exclude package.json --exclude README.md \
            "$SRCROOT/../../apps/explorer/" "$DEST/"
  # The product QA renderer (scripts/wallet-screens.sh): every screen and sheet
  # to PNG with the design-preview sample data. Its own app and bundle id; built
  # with WALLET_SCREENS, which compiles out the data move, the node start and
  # the keychain. Never shipped.
  WalletScreens:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
        excludes: ["**/.omc/**", ".omc/**", "AetherWalletApp.swift"]
      - path: Resources
        buildPhase: resources
      - Assets.xcassets
      - path: Generated/aether_ffi.swift
      - path: Screens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pipln.eastsea.screens
        PRODUCT_NAME: WalletScreens
        MARKETING_VERSION: 0.7.0
        CURRENT_PROJECT_VERSION: 13
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info-mac.plist
        INFOPLIST_KEY_LSUIElement: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG WALLET_SCREENS
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        HEADER_SEARCH_PATHS: $(SRCROOT)/Generated
        OTHER_LDFLAGS: $(SRCROOT)/../../target/release/libaether_ffi.a -framework SystemConfiguration -framework Security -framework CoreFoundation -framework OpenDirectory -framework IOKit
        ARCHS: arm64
