# EastSea-native B0-B2 templates, copied unmodified from the public
# eastsea-toolbox native/ folder (see README.md). Same compiler profile as
# eastsea-toolbox native/foundry.toml: solc 0.8.31, Osaka, optimizer 200.
[profile.default]
src = "src"
out = "out"
cache_path = "cache"
solc_version = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

[lint]
lint_on_build = false
