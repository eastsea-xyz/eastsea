[profile.default]
src = "src"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["openzeppelin/=lib/openzeppelin-contracts/contracts/"]
# AccountReceiver.t.sol runs the account code a new genesis predeploys.
fs_permissions = [{ access = "read", path = "../../../execution/src/aether_account_v2.bin.hex" }]
