[package]
name = "aether-crypto"
description = "Signer / verifier trait with P-256, secp256k1, ed25519 (docs/design/03)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[features]
# Only wallet/node transport needs this; prover guests keep the default signer
# surface. These packages and versions already exist in Cargo.lock.
registrar-encryption = ["dep:chacha20poly1305", "dep:serde", "dep:hex"]

[dependencies]
aether-types.workspace = true
p256.workspace = true
k256.workspace = true
ed25519-dalek.workspace = true
alloy-primitives.workspace = true
sha2 = "0.11"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
serde = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
proptest.workspace = true
