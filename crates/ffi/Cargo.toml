[package]
name = "aether-ffi"
description = "Wallet core exposed to Swift via UniFFI: light-client reads, tx preparation, Secure Enclave signature submission"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "aether_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen/main.rs"

[dependencies]
aether-types.workspace = true
aether-crypto.workspace = true
aether-execution.workspace = true
aether-light.workspace = true
aether-state.workspace = true
aether-net.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
anyhow = "1"
rand.workspace = true
alloy-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
p256 = { version = "=0.14.0", features = ["ecdsa"] }
# Decoding the certified block to check its chain id (same pin as aether-light).
commonware-codec = "=2026.9.0"
# Paper recovery key: 24 BIP-39 words derive a P-256 guardian key.
bip39 = { version = "2", features = ["rand"] }
sha2 = "0.11"
thiserror.workspace = true
uniffi = { version = "=0.32.2", features = ["cli"] }

[dev-dependencies]
# Fake follower/validator servers over local iroh (tests/wallet_spread.rs).
iroh = { version = "=1.2.0", features = ["unstable-custom-transports"] }
