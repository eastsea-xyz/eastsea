[package]
name = "aether-net"
description = "Public networking: iroh QUIC (hole punching, relays) + BitTorrent Mainline DHT discovery via pkarr"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
iroh = { version = "=1.2.0", features = ["unstable-custom-transports"] }
iroh-mainline-address-lookup = "=0.5.0"
# Already used by the address adapter (workspace-patched): a separate salted
# service descriptor must not overwrite iroh's unsalted address packet.
n0-mainline = "=0.6.0"
serde_json.workspace = true
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }
tracing = "0.1"
anyhow = "1"
rand.workspace = true
# Wallet-server announcements are signed by a candidate's voting key (the same
# pins as aether-node).
commonware-codec = "=2026.9.0"
commonware-cryptography = "=2026.9.0"
hex = "0.4"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
