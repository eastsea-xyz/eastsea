[package]
name = "aether-net"
description = "Public networking: iroh QUIC (hole punching, relays) + BitTorrent Mainline DHT discovery via pkarr"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
iroh = "=1.2.0"
iroh-mainline-address-lookup = "=0.5.0"
serde_json.workspace = true
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tracing = "0.1"
anyhow = "1"
