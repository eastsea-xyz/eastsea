[package]
name = "aether-node"
description = "Aether validator node: Commonware simplex + marshal, revm execution on EIP-7864 state, JSON-RPC"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
aether-types.workspace = true
aether-hash.workspace = true
aether-crypto.workspace = true
aether-state.workspace = true
aether-execution.workspace = true
aether-rewards.workspace = true
aether-light.workspace = true
aether-proving.workspace = true
aether-consensus.workspace = true
aether-net.workspace = true
alloy-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
postcard = { version = "1", features = ["alloc"] }

commonware-actor = "=2026.9.0"
commonware-broadcast = "=2026.9.0"
commonware-codec = "=2026.9.0"
commonware-coding = "=2026.9.0"
commonware-consensus = "=2026.9.0"
commonware-cryptography = "=2026.9.0"
commonware-p2p = "=2026.9.0"
commonware-parallel = "=2026.9.0"
commonware-resolver = "=2026.9.0"
commonware-runtime = "=2026.9.0"
commonware-storage = "=2026.9.0"
commonware-utils = "=2026.9.0"

bytes = "1.7"
futures = "0.3"
governor = "0.10"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
hex = "0.4"
p256 = { version = "=0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
base64 = "0.22"
redb = "4.3"
zstd = "0.13"

[dev-dependencies]
rand_chacha = "0.10"
# The reserve-hardening tests capture the chain's overdue warning (finding 6).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
