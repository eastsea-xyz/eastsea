[package]
name = "aether-node"
description = "Aether validator node: Commonware simplex + marshal, revm execution on EIP-7864 state, JSON-RPC"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
aether-types.workspace = true
aether-hash.workspace = true
aether-crypto.workspace = true
aether-state.workspace = true
aether-execution.workspace = true
aether-rewards.workspace = true
aether-light.workspace = true
aether-proving.workspace = true
aether-consensus.workspace = true
aether-net.workspace = true
alloy-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
postcard = { version = "1", features = ["alloc"] }

commonware-actor = "=2026.9.0"
commonware-broadcast = "=2026.9.0"
commonware-codec = "=2026.9.0"
commonware-coding = "=2026.9.0"
commonware-consensus = "=2026.9.0"
commonware-cryptography = "=2026.9.0"
commonware-p2p = "=2026.9.0"
commonware-parallel = "=2026.9.0"
commonware-resolver = "=2026.9.0"
commonware-runtime = "=2026.9.0"
commonware-storage = "=2026.9.0"
commonware-utils = "=2026.9.0"

bytes = "1.7"
futures = "0.3"
governor = "0.10"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
hex = "0.4"
sha2 = "0.11"
# BitTorrent v1 info hashes (era export, roadmap B6).
sha1 = "0.10"
libc = "0.2"
p256 = { version = "=0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
base64 = "0.22"
redb = "4.3"
zstd = "0.13"

[features]
# Compiles the resource-reading test seam (resources.rs `set_test_readings`)
# so integration tests (tests/) can pin the pressure level and available
# memory the snapshot gate sees. Never a default feature and never enabled by
# another crate's [dependencies]: the only place it is turned on is this
# crate's own [dev-dependencies] self-reference below, which plain builds
# (`cargo build`, `--release` included) never consult — a shipped binary
# compiles the seam out entirely.
test-seam = []
# Compiles the upgrade-drill hooks (upgrade.rs `implements`/`dev_notice`, the
# `dev-b3` subcommand) that scripts/upgrade-drill.sh needs to rehearse a
# protocol switch to a release this tree does not implement: shorten the
# mainnet upgrade notice and claim a later protocol, both only through
# AETHER_DEV_* environment variables. Same containment as test-seam: never a
# default feature, never enabled by another crate's [dependencies]; only the
# drill build passes it, so every shipped binary (plain `cargo build`,
# `--release`, the app bundle) compiles the hooks out entirely and ignores the
# variables.
dev-drill = []

[dev-dependencies]
rand_chacha = "0.10"
# Tests drive a Router by hand (oneshot) to hold responses outstanding —
# axum pulls tower in but does not re-export its ServiceExt.
tower = "0.5"
# The reserve-hardening tests capture the chain's overdue warning (finding 6).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Lets this crate's integration tests reach the test-only seam in resources.rs
# (tokio does the same self-reference for its test-util features).
aether-node = { path = ".", features = ["test-seam"] }
# The follower-transport test (follow.rs) stands up local-only iroh endpoints
# (no relay, no DHT) — the same version aether-net uses.
iroh = { version = "=1.2.0" }
