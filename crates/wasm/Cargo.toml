[package]
name = "aether-wasm"
description = "Browser wallet building, certified chain reads and iroh WebSocket relay transport"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-types.workspace = true
aether-crypto.workspace = true
aether-execution = { path = "../execution", default-features = false }
aether-light.workspace = true
aether-state.workspace = true
alloy-primitives.workspace = true
commonware-codec = "=2026.9.0"
serde_json.workspace = true
p256.workspace = true
wasm-bindgen = "0.2"

# Randomness is never used for signing here (the browser's WebCrypto signs), but
# dependencies link getrandom; in a browser it comes from crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
n0-future = "=0.3.2"
wasm-bindgen-futures = "0.4"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
