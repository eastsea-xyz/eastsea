[package]
name = "aether-jolt-block"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of the aether-node workspace (see root Cargo.toml exclude).
[workspace]
members = ["guest"]

[features]
# Prove with Akita (lattice PCS) on the optimized CPU backend instead of Dory.
akita = ["jolt-sdk/akita"]
# Akita with the Apple GPU (Metal) commitment and PIOP kernels.
metal = ["jolt-sdk/metal"]

[dependencies]
jolt-sdk = { path = "/Volumes/workspace/aether-jolt/jolt/jolt-sdk", features = ["host"] }
guest = { package = "aether-jolt-block-guest", path = "./guest" }
# Registers the P-256 inline instructions with the host tracer.
jolt-inlines-p256 = { path = "/Volumes/workspace/aether-jolt/jolt/jolt-inlines/p256", features = ["host"] }
# Registers the BLAKE3 inline (the state tree hash) with the host tracer.
jolt-inlines-blake3 = { path = "/Volumes/workspace/aether-jolt/jolt/jolt-inlines/blake3", features = ["host"] }
aether-execution = { path = "../../crates/execution" }
aether-crypto = { path = "../../crates/crypto" }
aether-types = { path = "../../crates/types" }
aether-hash = { path = "../../crates/hash" }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tracing-subscriber = "0.3"
tracing = "0.1"

# Same patches as the Jolt workspace (one arkworks and one jolt-field identity).
[patch.crates-io]
# Jolt's guest (riscv64 zero-linux) has no clock: skip the time-based seed.
foldhash = { path = "patches/foldhash-0.2.0" }
n0-mainline = { path = "../../vendor/n0-mainline" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }

[patch."https://github.com/a16z/jolt"]
jolt-field = { path = "/Volumes/workspace/aether-jolt/jolt/crates/jolt-field" }

# Our akita branch (Metal commit kernels fixed for M1 Max), as in the Jolt workspace.
[patch."https://github.com/markosg04/akita"]
akita-algebra = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-algebra" }
akita-config = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-config" }
akita-error = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-error" }
akita-metal = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-metal" }
akita-pcs = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-pcs" }
akita-prover = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-prover" }
akita-planner = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-planner" }
akita-schedules = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-schedules" }
akita-challenges = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-challenges" }
akita-transcript = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-transcript" }
akita-types = { path = "/Volumes/workspace/aether-jolt/akita/crates/akita-types" }

[profile.release]
debug = 1
