[package]
name = "aether-jolt-block-guest"
version = "0.1.0"
edition = "2021"
publish = false

[features]
guest = []

[dependencies]
jolt = { package = "jolt-sdk", path = "/Volumes/workspace/aether-jolt/jolt/jolt-sdk", features = ["guest-std", "stdout", "random", "thread"] }
aether-execution = { path = "../../../crates/execution", default-features = false }
aether-crypto = { path = "../../../crates/crypto" }
aether-types = { path = "../../../crates/types" }
aether-hash = { path = "../../../crates/hash" }
serde = { version = "1", features = ["derive"] }
jolt-inlines-p256 = { path = "/Volumes/workspace/aether-jolt/jolt/jolt-inlines/p256" }
serde_json = "1"

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "aether-jolt-block-guest"
path = "src/main.rs"
test = false
bench = false
